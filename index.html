<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>PANDADA</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&display=swap"
        rel="stylesheet"
        />
        <style>
        :root {
            --bg: #0d0d0f;
            --paper: #f6ecdf;
            --paper-line: #d8c6a8;
            --envelope: #2a2a2e;
            --envelope-flap: #38383d;
            --seal: #e0b34f;
            --pink: #ff8fab;
            --green: #8bc34a;
            --cream: #f5ecec;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-sizing: border-box;
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--cream);
            font-family: "Baloo 2", ui-rounded, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            overflow-x: hidden;
            padding: 24px 16px;
            max-width: 480px;
            margin-inline: auto;
            position: relative;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 0 0 6px;
            color: var(--pink);
        }
        p.sub {
            margin: 0 0 32px;
            font-size: 13px;
            color: #b9b0b0;
            text-align: center;
        }

        /* ---------- Envelope / Letter stage ---------- */
        .wrapper {
            position: relative;
            width: min(78vw, 300px);
            aspect-ratio: 1 / 1;
            cursor: pointer;
        }
        .closed,
        .opened {
            position: absolute;
            inset: 0;
            transition:
            opacity 0.7s ease,
            transform 0.7s ease;
        }
        .letter-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.5));
        }

        .closed {
            opacity: 1;
            transform: scale(1);
        }

        .opened {
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
        }

        .wrapper.is-open .closed {
            opacity: 0;
            transform: scale(0.94);
        }
        .wrapper.is-open .opened {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* ---------- Modal / popup ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px) brightness(0.7);
            -webkit-backdrop-filter: blur(8px) brightness(0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 10;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .frame-wrap {
            position: relative;
            width: min(84vw, 320px);
            height: 260px;
        }
        .frame {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 150px;
            height: 180px;
            background: #fff;
            border-radius: 6px;
            padding: 8px 8px 22px;
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
            transition:
            opacity 0.45s ease,
            transform 0.45s ease;
        }
        .frame .pic {
            width: 100%;
            height: 100%;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            overflow: hidden;
        }
        .frame .pic img,
        .big-card .pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: inherit;
        }
        .frame:nth-child(1) {
            background: #ff7777;
        }
        .frame:nth-child(2) {
            background: #aeffb4;
        }
        .frame:nth-child(3)  {
            background: #f2b8fb;
        }
        .frame:nth-child(1) .pic {
            background: linear-gradient(160deg, #f2f2f2, #dcdcdc);
        }
        .frame:nth-child(2) .pic {
            background: linear-gradient(160deg, #fde2e9, #ffc2d1);
        }
        .frame:nth-child(3) .pic {
            background: linear-gradient(160deg, #e3f2d9, #c9e8b3);
        }
        .frame figcaption {
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: #555;
        }

        .modal-overlay.active .frame:nth-child(1) {
            transform: translate(calc(-50% - 78px), -52%) rotate(-8deg) scale(1);
            opacity: 1;
            transition-delay: 0.05s;
        }
        .modal-overlay.active .frame:nth-child(2) {
            transform: translate(-50%, -58%) rotate(3deg) scale(1);
            opacity: 1;
            transition-delay: 0.18s;
        }
        .modal-overlay.active .frame:nth-child(3) {
            transform: translate(calc(-50% + 78px), -52%) rotate(9deg) scale(1);
            opacity: 1;
            transition-delay: 0.31s;
        }

        .modal-close {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: var(--cream);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .modal-caption {
            position: absolute;
            bottom: 14%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            color: var(--pink);
            font-weight: 600;
        }

        /* ---------- Bigger single-image popup ---------- */
        .big-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px) brightness(0.6);
            -webkit-backdrop-filter: blur(10px) brightness(0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .big-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .big-card {
            position: relative;
            width: 238px;
            height: 284px;
            background: linear-gradient(90deg, #ff7777, #aeffb4, #f2b8fb);
            border-radius: 8px;
            padding: 12px 12px 32px;
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: scale(0.8);
            transition:
            opacity 0.35s ease,
            transform 0.35s ease;
        }
        .big-overlay.active .big-card {
            opacity: 1;
            transform: scale(1);
        }
        .big-card .pic {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 88px;
            overflow: hidden;
        }
        .big-card figcaption {
            position: absolute;
            bottom: 9px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #555;
        }
        .big-close {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--seal);
            color: #2a1d00;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
        }
        </style>
    </head>
    <body>
        <h1>PANDADA</h1>
        <p class="sub">tap the envelope to open it, then tap the letter</p>

        <div class="wrapper" id="wrapper">
        <div class="closed" id="closed">
            <img
            class="letter-img"
            src="closed-letter.png"
            alt="Closed envelope"
            />
        </div>
        <div class="opened" id="opened">
            <img
            class="letter-img"
            src="opened-letter.png"
            alt="Opened letter with a heart"
            />
        </div>
        </div>

        <div class="modal-overlay" id="modal">
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        <div class="frame-wrap">
            <figure class="frame">
            <div class="pic">
                <img src="1.png" alt="panda" loading="lazy">
            </div>
            <figcaption>panda 1</figcaption>
            </figure>
            <figure class="frame">
            <div class="pic">
                <img src="2.png" alt="panda" loading="lazy">
            </div>
            <figcaption>panda 2</figcaption>
            </figure>
            <figure class="frame">
            <div class="pic">
                <img src="3.png" alt="panda" loading="lazy">
            </div>
            <figcaption>panda 3</figcaption>
            </figure>
        </div>
        <p class="modal-caption">happy little surprise</p>
        </div>

        <div class="big-overlay" id="bigOverlay">
        <div class="big-card">
            <button class="big-close" id="bigClose" aria-label="Close">✕</button>
            <div class="pic" id="bigPic"></div>
            <figcaption id="bigCaption"></figcaption>
        </div>
        </div>

        <script>
        const wrapper = document.getElementById("wrapper");
        const closed = document.getElementById("closed");
        const opened = document.getElementById("opened");
        const modal = document.getElementById("modal");
        const modalClose = document.getElementById("modalClose");

        closed.addEventListener("click", () => {
            wrapper.classList.add("is-open");
        });

        opened.addEventListener("click", () => {
            if (!wrapper.classList.contains("is-open")) return;
            modal.classList.add("active");
        });

        modalClose.addEventListener("click", (e) => {
            e.stopPropagation();
            modal.classList.remove("active");
        });
        modal.addEventListener("click", (e) => {
            if (e.target === modal) modal.classList.remove("active");
        });

        /* ---- Bigger single-image popup ---- */
        const bigOverlay = document.getElementById("bigOverlay");
        const bigPic = document.getElementById("bigPic");
        const bigCaption = document.getElementById("bigCaption");
        const bigClose = document.getElementById("bigClose");

        document.querySelectorAll(".frame").forEach((frame) => {
            frame.addEventListener("click", (e) => {
            e.stopPropagation();
            const pic = frame.querySelector(".pic");
            const caption = frame.querySelector("figcaption").textContent;
            bigPic.innerHTML = pic.innerHTML;
            bigCaption.textContent = caption;
            bigOverlay.classList.add("active");
            });
        });

        bigClose.addEventListener("click", (e) => {
            e.stopPropagation();
            bigOverlay.classList.remove("active");
        });
        bigOverlay.addEventListener("click", (e) => {
            if (e.target === bigOverlay) bigOverlay.classList.remove("active");
        });
        </script>
    </body>
</html>
